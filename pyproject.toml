[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-transform-proxy"
version = "0.1.0"
description = "A CLI proxy for MCP servers with configurable tool transformations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "MCP Transform Proxy Contributors" }
]
keywords = ["mcp", "proxy", "llm", "tools", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=3.0.0b1",
    "click>=8.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
mcp-transform-proxy = "mcp_transform_proxy.cli:main"

[project.urls]
Homepage = "https://github.com/bbrowning/mcp-transform-proxy"
Repository = "https://github.com/bbrowning/mcp-transform-proxy"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_transform_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
