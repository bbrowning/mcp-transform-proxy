apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-transform-proxy
  namespace: mcp-transform-proxy
  labels:
    app.kubernetes.io/name: mcp-transform-proxy
spec:
  to:
    kind: Service
    name: mcp-transform-proxy
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
