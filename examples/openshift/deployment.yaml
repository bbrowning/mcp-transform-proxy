apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-transform-proxy
  namespace: mcp-transform-proxy
  labels:
    app.kubernetes.io/name: mcp-transform-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-transform-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-transform-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: quay.io/bbrowning/mcp-transform-proxy:latest
          args:
            - "--config"
            - "/config/config.json"
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /sse
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /sse
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: mcp-transform-proxy-config
